name: Daily Lunch Notification

on:
  schedule:
    # 목표: 평일 오전 9시경(KST = UTC+9) 발송
    # 이 저장소는 fork라 GitHub이 예약 워크플로우 실행을 뒤로 미룹니다.
    #   실측 지연: 예약 대비 약 1.5~2시간 (원본 저장소는 ~20분).
    # 그래서 예약을 그만큼 앞당김: 22:20 UTC(전날) = 07:20 KST
    #   → 관측 지연(~90~110분)을 더해 실제 실행 ~08:45~09:30 KST (부하에 따라 변동)
    # 정확히 9시에 보내려면 아래 repository_dispatch를 외부 스케줄러(예: cron-job.org)로 호출하세요.
    - cron: '20 22 * * 0-4'
  workflow_dispatch:  # 수동 실행 가능
  repository_dispatch:  # Mattermost 등 외부 트리거용(정시 발송에 권장)
    types: [mm-daily]

jobs:
  send-daily-lunch:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout repository
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Validate Webhook URLs
      env:
        MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        if [ -z "$MATTERMOST_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then
          echo "❌ 오류: MATTERMOST_WEBHOOK_URL 또는 DISCORD_WEBHOOK_URL 중 최소 하나는 설정되어야 합니다."
          echo ""
          echo "다음 단계를 수행하세요:"
          echo "1. GitHub Repository Settings로 이동"
          echo "2. Secrets and variables > Actions 선택"
          echo "3. 'New repository secret' 클릭"
          echo "4. Name: MATTERMOST_WEBHOOK_URL 또는 DISCORD_WEBHOOK_URL"
          echo "5. Value: Webhook URL 입력"
          echo "6. 'Add secret' 클릭"
          echo ""
          echo "자세한 내용은 README.md 파일을 참조하세요."
          exit 1
        else
          if [ -n "$MATTERMOST_WEBHOOK_URL" ]; then
            echo "✅ MATTERMOST_WEBHOOK_URL이 설정되어 있습니다."
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "✅ DISCORD_WEBHOOK_URL이 설정되어 있습니다."
          fi
        fi
    
    - name: Send daily lunch notification
      env:
        MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # 주간 파일이 없을 때 daily가 20층을 즉석 크롤(사진 없이)하기 위해 필요.
        # 10층은 이미지 커밋 전까지 '준비중...'으로 유지됨.
        WELSTORY_USERNAME: ${{ secrets.WELSTORY_USERNAME }}
        WELSTORY_PASSWORD: ${{ secrets.WELSTORY_PASSWORD }}
        # repository_dispatch(client_payload.date)로 날짜를 받으면 해당 날짜, 없으면 오늘
        REQUESTED_DATE: ${{ github.event.client_payload.date }}
      run: |
        cd src
        if [ -n "$REQUESTED_DATE" ]; then
          echo "📅 요청된 날짜로 전송: $REQUESTED_DATE"
          python main.py daily --date "$REQUESTED_DATE" --db ../db
        else
          python main.py daily --db ../db
        fi
